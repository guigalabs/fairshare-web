<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E7C4A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FairShare" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/icons/favicon-32.png"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icons/pwa-192.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/icons/apple-touch-icon.png"
    />
    <meta name="commit-sha" content="%sveltekit.env.PUBLIC_COMMIT_SHA%" />
    <meta
      property="og:image"
      content="https://fairshare.guigalabs.com/icons/pwa-512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="FairShare" />
    <meta property="og:site_name" content="FairShare" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="https://fairshare.guigalabs.com/icons/pwa-512.png"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

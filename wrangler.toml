name = "fairshare-web"
compatibility_date = "2025-04-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

# Waitlist signups (Pro + iOS) write to the `waitlist` table in the same
# Neon database that backs auth + cases. No extra binding needed — the
# DATABASE_URL Pages secret already covers it.

# Stripe Managed Payments handles billing — Stripe is the merchant of
# record, so global VAT / sales-tax / fraud / disputes are absorbed by
# Stripe (no separate Tax/Radar subscription).
#
# Set as Pages secrets:
#   wrangler pages secret put STRIPE_SECRET_KEY
#   wrangler pages secret put STRIPE_WEBHOOK_SECRET
#   wrangler pages secret put STRIPE_PUBLISHABLE_KEY
#   wrangler pages secret put STRIPE_PRICE_ID_MONTHLY
#   wrangler pages secret put STRIPE_PRICE_ID_ANNUAL
#
# Webhook URL (paste into Stripe Dashboard → Developers → Webhooks):
#   https://fairshare.guigalabs.com/api/stripe/webhook
# Subscribe to: customer.subscription.{created,updated,deleted,paused,resumed}
#
# Activate Managed Payments (Dashboard only — no API):
#   https://dashboard.stripe.com/settings/managed-payments
# All products must use an MP-eligible tax code; the price IDs above
# must be on Managed-Payments-eligible products.
#
# API version is pinned in src/lib/server/stripe.ts to 2025-03-31.basil.

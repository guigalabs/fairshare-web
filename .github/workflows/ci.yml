name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Type-check, format, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run check
      - run: bun run test
      - run: bun run build
        env:
          PUBLIC_COMMIT_SHA: ${{ github.sha }}

  e2e:
    name: Playwright e2e + a11y
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          PUBLIC_COMMIT_SHA: ${{ github.sha }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # adapter-cloudflare emits the deployable bundle to
          # .svelte-kit/cloudflare/. Pre-PR-1 the project used
          # adapter-static which wrote to ./out; the Pages project
          # itself is the same.
          command: pages deploy .svelte-kit/cloudflare --project-name=fairshare-web --branch=main --commit-hash=${{ github.sha }}
      - name: Smoke test live site
        env:
          SHA: ${{ github.sha }}
          URL: https://fairshare.guigalabs.com/
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 10 "${URL}?cb=$(date +%s)" | grep -q "name=\"commit-sha\" content=\"${SHA}\""; then
              echo "Smoke test passed: ${URL} serves ${SHA}"
              exit 0
            fi
            echo "Attempt ${i}: ${URL} not yet serving ${SHA}, retrying in 6s..."
            sleep 6
          done
          echo "Smoke test failed: ${URL} did not serve ${SHA} after 30s"
          exit 1
